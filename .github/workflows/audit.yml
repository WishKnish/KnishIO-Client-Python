# Python SDK scheduled dependency audit — advisories against a tree nobody pushed to.
#
# Why a SCHEDULE and not just the python-package.yml audit step: an advisory is published
# against code that has NOT changed. That is the 2026-07 → 2026-08 lesson — a repo sits green
# for weeks while a package it already ships acquires a CVE, because nothing re-examines a
# tree with no commits. python-package.yml answers "did this change break anything"; this file
# answers "did the world change underneath us". Only the second question has a clock.
#
# All FOUR requirement sets are scanned; the dev toolchain is the point of this file:
#   requirements.txt       the runtime floors a consumer resolves against
#   requirements.lock      the reproducible runtime resolution
#   requirements-dev.txt   the dev toolchain — where a build-time supply-chain attack lands
#   requirements-dev.lock  the hashed dev resolution CI and publish install from
#
# NOTE: scheduled workflows only fire from the DEFAULT BRANCH. This file has no effect until
# it is merged there — a branch-only copy runs never, silently.
name: Scheduled audit

on:
  schedule:
    # Mondays 06:17 UTC. Deliberately off the hour: GitHub sheds scheduled runs when the
    # top-of-hour queue saturates, and a weekly job that quietly does not run is worse than
    # no job at all, because it reads as green.
    - cron: '17 6 * * 1'
  # Manual trigger, plus a deliberate-failure switch. A gate nobody has watched FAIL is an
  # unproven gate: set selftest_fail to make a run exit 1 on purpose and confirm the failure
  # is actually visible wherever these notifications land.
  workflow_dispatch:
    inputs:
      selftest_fail:
        description: 'Fail this run on purpose, to prove the alert path works. Audits nothing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit (runtime + lock + dev)
    runs-on: ubuntu-latest
    steps:
      # `if: inputs.selftest_fail` reads the DECLARED BOOLEAN directly. Do not "fix" this to
      # `== 'true'`: GitHub coerces mismatched types to number for loose equality, the string
      # 'true' casts to NaN, and NaN equals nothing — so that form is always false and the
      # probe would silently never fire. The input is used only inside this expression and is
      # never interpolated into shell text.
      - name: Selftest failure probe
        if: inputs.selftest_fail
        run: |
          echo "::error::Selftest failure probe requested — failing this run deliberately."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Mirrors python-package.yml's setup step (same action SHA, same '3.x').
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      # Only the auditor is installed — the SDK's own dependencies are never installed here,
      # so no third-party package code executes in this job. pip-audit reads the requirement
      # files and resolves against the advisory database.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: pip-audit (runtime floors, committed locks, dev toolchain)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.txt
          pip-audit -r requirements-dev.lock

  # The shipped graph as a CycloneDX SBOM (pip runtime lock + the bin/ ML-KEM bridge + bundled
  # libkcore and its pinned upstream commits), re-scanned with OSV against today's advisories.
  # Same definition as the python-package.yml `sbom` job; nothing is uploaded here.
  sbom:
    name: SBOM (CycloneDX) + OSV scan
    runs-on: ubuntu-latest
    steps:
      - name: Selftest failure probe
        if: inputs.selftest_fail
        run: |
          echo "::error::Selftest failure probe requested — failing this run deliberately."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Set up Node.js (for the ML-KEM noble bridge)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'

      - name: Install the SBOM generator
        run: python -m pip install cyclonedx-bom==7.5.0

      - name: Generate SBOM
        run: bash .github/scripts/sbom.sh

      - name: Export SBOM paths
        run: cat sbom-out/paths.env >> "$GITHUB_ENV"

      - name: OSV scan (SBOM + pinned upstream commits)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
        with:
          scan-args: |-
            -L
            ${{ env.SBOM_FILE }}
            -L
            osv-scanner:${{ env.OSV_COMMITS_FILE }}
